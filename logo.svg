<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Linen/cloth texture gradient -->
    <linearGradient id="cloth" x1="0" y1="0" x2="0.1" y2="1">
      <stop offset="0%" stop-color="#D4C5A0"/>
      <stop offset="30%" stop-color="#C9B88C"/>
      <stop offset="60%" stop-color="#D1C29A"/>
      <stop offset="100%" stop-color="#C4B385"/>
    </linearGradient>
    <!-- Aged sepia stain for the imprint -->
    <radialGradient id="stain" cx="0.5" cy="0.45" r="0.45">
      <stop offset="0%" stop-color="#8B6914" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#7A5C10" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6B4E0E" stop-opacity="0"/>
    </radialGradient>
    <!-- Burn/imprint color for the claw -->
    <radialGradient id="imprint" cx="0.5" cy="0.48" r="0.4">
      <stop offset="0%" stop-color="#5C3D0E" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7A5820" stop-opacity="0.4"/>
    </radialGradient>
    <!-- Fabric weave pattern -->
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="none"/>
      <line x1="0" y1="4" x2="8" y2="4" stroke="#B8A878" stroke-width="0.3" opacity="0.3"/>
      <line x1="4" y1="0" x2="4" y2="8" stroke="#B8A878" stroke-width="0.3" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Cloth background with rounded corners (like folded fabric) -->
  <rect x="16" y="16" width="480" height="480" rx="24" ry="24" fill="url(#cloth)"/>
  <rect x="16" y="16" width="480" height="480" rx="24" ry="24" fill="url(#weave)"/>

  <!-- Aged stain around the imprint -->
  <rect x="16" y="16" width="480" height="480" rx="24" ry="24" fill="url(#stain)"/>

  <!-- Fold/crease lines -->
  <line x1="256" y1="16" x2="256" y2="496" stroke="#B0A070" stroke-width="0.8" opacity="0.25"/>
  <line x1="16" y1="256" x2="496" y2="256" stroke="#B0A070" stroke-width="0.8" opacity="0.25"/>

  <!-- Claw imprint — Turin Shroud style (faded, sepia, ghostly) -->
  <g fill="url(#imprint)" opacity="0.85">
    <!-- Main claw body / carapace -->
    <ellipse cx="256" cy="280" rx="80" ry="60"/>

    <!-- Head section -->
    <ellipse cx="256" cy="220" rx="48" ry="32"/>

    <!-- Left pincer arm -->
    <path d="
      M 200 240
      C 170 220, 130 190, 108 160
      C 100 148, 95 132, 102 120
      C 110 108, 125 112, 132 124
      L 148 156
      C 150 148, 145 136, 138 126
      C 130 112, 128 96, 138 88
      C 148 80, 160 90, 164 104
      L 176 148
      C 168 170, 180 200, 200 240 Z
    "/>

    <!-- Right pincer arm (mirrored) -->
    <path d="
      M 312 240
      C 342 220, 382 190, 404 160
      C 412 148, 417 132, 410 120
      C 402 108, 387 112, 380 124
      L 364 156
      C 362 148, 367 136, 374 126
      C 382 112, 384 96, 374 88
      C 364 80, 352 90, 348 104
      L 336 148
      C 344 170, 332 200, 312 240 Z
    "/>

    <!-- Left legs -->
    <path d="M 180 270 C 150 280, 120 300, 100 320 C 96 326, 100 332, 108 328 C 128 312, 155 295, 180 285 Z"/>
    <path d="M 178 290 C 148 308, 115 332, 96 356 C 92 362, 96 368, 104 364 C 124 344, 152 320, 180 302 Z"/>
    <path d="M 180 308 C 154 330, 128 362, 114 390 C 112 396, 116 400, 122 396 C 138 370, 160 342, 184 318 Z"/>

    <!-- Right legs (mirrored) -->
    <path d="M 332 270 C 362 280, 392 300, 412 320 C 416 326, 412 332, 404 328 C 384 312, 357 295, 332 285 Z"/>
    <path d="M 334 290 C 364 308, 397 332, 416 356 C 420 362, 416 368, 408 364 C 388 344, 360 320, 332 302 Z"/>
    <path d="M 332 308 C 358 330, 384 362, 398 390 C 400 396, 396 400, 390 396 C 374 370, 352 342, 328 318 Z"/>
  </g>

  <!-- Eyes — faint glowing dots on the imprint -->
  <circle cx="240" cy="216" r="6" fill="#8B6914" opacity="0.6"/>
  <circle cx="272" cy="216" r="6" fill="#8B6914" opacity="0.6"/>
  <circle cx="240" cy="216" r="3" fill="#A07818" opacity="0.4"/>
  <circle cx="272" cy="216" r="3" fill="#A07818" opacity="0.4"/>

  <!-- Subtle privacy symbols scattered like aging marks -->
  <g fill="#8B6914" opacity="0.15" font-family="monospace" font-size="10">
    <text x="68" y="80" transform="rotate(-5 68 80)">***</text>
    <text x="400" y="100" transform="rotate(3 400 100)">0x</text>
    <text x="80" y="430" transform="rotate(-2 80 430)">###</text>
    <text x="380" y="440" transform="rotate(4 380 440)">***</text>
    <text x="420" y="260" transform="rotate(-3 420 260)">0x</text>
    <text x="60" y="280" transform="rotate(2 60 280)">###</text>
  </g>

  <!-- Edge fraying / aging marks -->
  <g stroke="#A09060" stroke-width="0.5" opacity="0.2" fill="none">
    <path d="M 40 20 C 42 24, 38 28, 40 32"/>
    <path d="M 470 18 C 472 22, 468 26, 470 30"/>
    <path d="M 18 470 C 22 472, 20 476, 18 480"/>
    <path d="M 490 472 C 492 476, 488 480, 490 484"/>
  </g>
</svg>