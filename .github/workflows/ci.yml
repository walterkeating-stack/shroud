name: CI
on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - id: release_gate
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view shroud-privacy version 2>/dev/null || echo "")
          echo "pkg_version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "published_version=${PUBLISHED_VERSION}" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            if [[ "${TAG_VERSION}" != "${PKG_VERSION}" ]]; then
              echo "Tag version (${TAG_VERSION}) does not match package.json (${PKG_VERSION})."
              exit 1
            fi
          fi

          if [[ "${PKG_VERSION}" == "${PUBLISHED_VERSION}" ]]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Version ${PKG_VERSION} is already published. Skipping npm publish."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "New release detected: ${PKG_VERSION} (npm has: ${PUBLISHED_VERSION:-none})"
          fi
      - if: steps.release_gate.outputs.should_publish == 'true'
        run: npm publish --provenance
